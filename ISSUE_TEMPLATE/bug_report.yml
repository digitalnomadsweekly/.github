name: Bug Report
description: Create a report to help us improve and fix reproducible bugs.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: environment
    attributes:
      label: Environment / OS
      description: What OS, browser, or runtime environment are you using?
      placeholder: e.g., macOS 14.5, Node.js v20, Chrome 125
    validations:
      required: true
  - type: textarea
    id: describe-bug
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    id: logs-screenshots
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any error logs, stack traces, or screenshots here.
      render: shell
    validations:
      required: false
